<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;700&family=Caveat:wght@400&display=swap" rel="stylesheet">
<style>
/* ---- Yarden tokens (from the Yarden design system artifact) ---- */
:root{
  --green-50:#ecfdf3;--green-100:#d1fae0;--green-200:#a7f3c4;--green-300:#6ee7a0;--green-400:#34d474;
  --green-500:#16a34a;--green-600:#0f7a36;--green-700:#0c5f2b;--green-800:#0a4a22;--green-900:#073618;
  --amber-50:#fffbeb;--amber-100:#fef3c7;--amber-200:#fde68a;--amber-300:#fcd34d;--amber-400:#fbbf24;
  --sand:#f5e6cc;--sand-light:#fff8ee;--paper:#fefcf7;--earth-light:#d4a843;--sky-400:#38bdf8;
  --font-display:"Fredoka",sans-serif;--font-body:"Nunito",sans-serif;--font-script:"Caveat",cursive;
  --r2xl:40px;--rfull:9999px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:var(--font-body);color:var(--green-900);background:var(--green-50);-webkit-font-smoothing:antialiased}

/* Safe zone: platform UI covers roughly the top 14% and bottom 18% on 9:16. All content sits inside .safe. */
.slide{position:relative;width:1080px;height:1920px;overflow:hidden}
.safe{position:absolute;left:72px;right:72px;top:270px;bottom:350px;padding-bottom:90px;display:flex;flex-direction:column}
/* The bottom 90px of .safe is reserved for the "Swipe →" marker (at bottom:370px) — content never enters it. */

/* ---- Grounds ---- */
.ground-cream{background:var(--green-50)}
.ground-sand{background:var(--sand-light)}
.ground-paper{background:var(--paper)}
.ground-hero{background:linear-gradient(160deg,#0c5f2b 0%,#16a34a 55%,#34d474 100%);color:var(--green-50)}
.glow-amber{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(253,230,138,.35) 0%,rgba(253,230,138,0) 65%);top:-250px;right:-300px}
.glow-sky{position:absolute;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.28) 0%,rgba(56,189,248,0) 65%);bottom:-200px;left:-300px}

/* ---- Type ---- */
.script{font-family:var(--font-script);font-size:72px;line-height:1;color:var(--green-600)}
.ground-hero .script{color:var(--amber-200)}
.hook{font-family:var(--font-display);font-weight:700;font-size:112px;line-height:1.08;letter-spacing:-.02em}
.hook.sm{font-size:92px}
.hook .hl{color:var(--amber-200)}
.heading{font-family:var(--font-display);font-weight:700;font-size:84px;line-height:1.12;letter-spacing:-.01em}
.heading .hl{color:var(--green-600)}
.body{font-size:44px;line-height:1.45;font-weight:400;color:var(--green-800)}
.body b{font-weight:700;color:var(--green-900)}
.eyebrow{font-weight:700;font-size:30px;letter-spacing:.12em;text-transform:uppercase;color:var(--green-600)}
.ground-hero .eyebrow{color:var(--amber-200)}

/* ---- Pieces ---- */
.pill{display:inline-flex;align-items:center;gap:14px;font-family:var(--font-display);font-weight:700;font-size:34px;padding:16px 36px;border-radius:var(--rfull);background:var(--green-100);color:var(--green-800);align-self:flex-start}
.ground-hero .pill{background:rgba(255,255,255,.18);color:#fff}
.num{display:inline-flex;align-items:center;justify-content:center;width:120px;height:120px;border-radius:var(--rfull);background:var(--green-100);color:var(--green-700);font-family:var(--font-display);font-weight:700;font-size:64px;margin-bottom:36px}
.card{background:#fff;border:4px solid var(--green-200);border-radius:var(--r2xl);padding:56px;box-shadow:0 10px 15px -3px rgba(0,0,0,.1)}
.card-warm{background:var(--amber-50);border:4px solid var(--amber-200);border-radius:var(--r2xl);padding:56px}
.photo{width:100%;border-radius:var(--r2xl);border:4px solid var(--green-200);object-fit:cover;box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
.photo.tall{height:860px}
.photo.short{height:560px}
.photo.banner{height:auto;border-color:var(--amber-200)}
.photo.natural{width:auto;max-width:100%;max-height:800px;height:auto;align-self:center}
.quote{font-family:var(--font-body);font-size:46px;line-height:1.45;color:var(--green-800);font-style:italic}
.quote-by{font-family:var(--font-display);font-weight:600;font-size:36px;color:var(--green-600);margin-top:24px}
.quote-mark{font-family:var(--font-script);font-size:140px;line-height:.6;color:var(--amber-400)}
.slide.photo-hook .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide.photo-hook .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,54,24,.25) 0%,rgba(7,54,24,.45) 45%,rgba(7,54,24,.92) 100%)}
.slide.photo-hook .safe{justify-content:flex-end;color:#fff}
.slide.photo-hook .hook .hl{color:var(--amber-200)}
.slide.photo-hook .pill{background:rgba(255,255,255,.18);color:#fff}
.slide.photo-hook .swipe,.slide.photo-hook .script,.slide.photo-hook .eyebrow{color:var(--amber-200)}
.cta-line{font-family:var(--font-display);font-weight:700;font-size:52px;line-height:1.2;color:var(--green-900)}
.cta-line .hl{color:var(--green-600)}
.check{display:flex;gap:28px;align-items:flex-start;font-size:44px;line-height:1.4;color:var(--green-800)}
.check::before{content:"✓";font-family:var(--font-display);font-weight:700;color:var(--green-600);font-size:48px;line-height:1.3}
.cta-btn{display:inline-flex;align-items:center;gap:20px;background:var(--amber-400);color:var(--green-900);font-family:var(--font-display);font-weight:700;font-size:46px;padding:36px 60px;border-radius:var(--rfull);box-shadow:0 20px 25px -5px rgba(0,0,0,.12);align-self:flex-start}
.url{font-family:var(--font-display);font-weight:600;font-size:48px;color:var(--green-700)}
.logo{height:72px}
.wave{position:absolute;left:0;right:0;bottom:0;height:160px}
.swipe{position:absolute;right:72px;bottom:370px;font-family:var(--font-display);font-weight:600;font-size:34px;color:var(--green-600);display:flex;align-items:center;gap:12px}
.ground-hero .swipe{color:var(--amber-200)}
.brand-corner{position:absolute;left:72px;bottom:370px;display:flex;align-items:center;gap:18px}
.brand-corner img{height:56px}
.stack{display:flex;flex-direction:column;gap:40px}
.safe.vc{justify-content:center}
.grow{flex:1}
.mt-auto{margin-top:auto}
.center{text-align:center;align-items:center}
.divider{height:6px;width:160px;border-radius:var(--rfull);background:var(--amber-400);margin:36px 0}
</style>
</head>
<body>
<!-- SLIDE_CONTENT -->
</body>
</html>
